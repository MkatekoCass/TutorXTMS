<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/txlogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Complete Registration | Tutor Management System</title>

    <link rel="stylesheet" href="../css/auth-global.css" />

    <!-- Fonts used by your stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="../js/theme.js"></script>
    <script src="../js/auto-sync.js"></script>
  </head>

  <body>
    <main class="auth-page">
      <section class="auth-card">
        <header class="auth-header">
          <span class="eyebrow">Tutor Management System</span>

          <h1>Complete your account</h1>

          <p>Just a few more details are needed to finish your registration.</p>
        </header>

        <form id="google-register-form">
          <!-- =========================
                     NAME
                     ========================= -->

          <div class="form-group">
            <label for="name"> Full name </label>

            <input type="text" id="name" name="name" readonly />
          </div>

          <!-- =========================
                     EMAIL
                     ========================= -->

          <div class="form-group">
            <label for="email"> Email </label>

            <input type="email" id="email" name="email" readonly />
          </div>

          <!-- =========================
                     ROLE
                     ========================= -->

          <div class="form-group">
            <label for="role"> Account type </label>

            <select id="role" name="role" required>
              <option value="" disabled selected>Select your role</option>

              <option value="volunteer">Volunteer</option>

              <option value="tutor">Tutor</option>

              <option value="organiser">Organiser</option>
            </select>
          </div>

          <!-- =========================
                     STUDENT NUMBER

                     Shown for:
                     - Student
                     - Tutor
                     ========================= -->

          <div
            class="form-group"
            id="student-number-group"
            style="display: none"
          >
            <label for="student-number"> Student number </label>

            <input
              type="text"
              id="student-number"
              name="student-number"
              placeholder="e.g. 1234567"
              maxlength="7"
              inputmode="numeric"
            />
          </div>

          <!-- =========================
                     ORGANISER COURSE

                     Shown only for:
                     - Organiser
                     ========================= -->

          <div class="form-group" id="course-group" style="display: none">
            <label for="course"> Course to organise </label>

            <select id="course" name="course">
              <option value="" disabled selected>Select a course</option>
            </select>
          </div>

          <!-- =========================
                     SUBMIT
                     ========================= -->

          <button type="submit" class="btn btn-primary auth-button">
            Complete registration
          </button>
        </form>

        <!-- =========================
                 MESSAGE
                 ========================= -->

        <p
          id="google-register-message"
          class="form-message"
          aria-live="polite"
        ></p>
      </section>
    </main>

    <script>
      /* ================================================
         GET GOOGLE USER INFORMATION
         ================================================ */

      const googleUserId = sessionStorage.getItem("googleUserId");
      const googleEmail = sessionStorage.getItem("googleEmail");
      const googleName = sessionStorage.getItem("googleName");

      const message = document.getElementById("google-register-message");

      // Mirrors auth.js setMessage — toggles the state classes that colour
      // the shared .form-message element (see auth-global.css).
      function setMessage(text, kind) {
        message.textContent = text;
        message.classList.toggle("is-error", kind === "error");
        message.classList.toggle("is-success", kind === "success");
      }

      /* ================================================
         MAKE SURE GOOGLE USER INFORMATION EXISTS
         ================================================ */

      if (!googleUserId || !googleEmail) {
        setMessage(
          "Google account information could not be found. Please try signing in again.",
          "error",
        );
      }

      /* ================================================
         FILL IN GOOGLE INFORMATION
         ================================================ */

      document.getElementById("name").value = googleName || "";
      document.getElementById("email").value = googleEmail || "";

      /* ================================================
         GET FORM ELEMENTS
         ================================================ */

      const roleSelect = document.getElementById("role");
      const studentNumberGroup = document.getElementById(
        "student-number-group",
      );
      const studentNumberInput = document.getElementById("student-number");
      const courseGroup = document.getElementById("course-group");
      const courseSelect = document.getElementById("course");

      /* ================================================
         ORGANISER COURSES

         Fetched at most once, the first time "organiser"
         is picked — the same lazy load as register.html's
         copy in public/js/auth.js.
         ================================================ */

      let coursesRequested = false;

      async function loadCoursesOnce({ refresh = false } = {}) {
        if (coursesRequested && !refresh) return;

        coursesRequested = true;
        const selectedCourseId = refresh ? courseSelect.value : "";

        try {
          const response = await fetch("/api/courses");

          const rows = await response.json();

          if (!response.ok) {
            throw new Error(rows.error || "Failed to load courses");
          }

          if (refresh) {
            courseSelect
              .querySelectorAll('option:not([value=""])')
              .forEach((option) => option.remove());
          }
          rows.forEach((row) => {
            const option = document.createElement("option");

            option.value = row.id;

            option.textContent = `${row.course_code} — ${row.course_name}`;

            courseSelect.appendChild(option);
          });
          if (
            selectedCourseId &&
            rows.some((row) => String(row.id) === selectedCourseId)
          ) {
            courseSelect.value = selectedCourseId;
          }
        } catch (error) {
          console.error("Course load error:", error);

          coursesRequested = false;

          setMessage(
            "Couldn't load the course list — please try again.",
            "error",
          );
        }
      }

      window.AutoSync?.start(() => {
        if (roleSelect.value === "organiser") {
          return loadCoursesOnce({ refresh: true });
        }
      });

      /* ================================================
         ROLE CHANGE
         ================================================ */

      roleSelect.addEventListener("change", () => {
        studentNumberGroup.style.display = "none";
        studentNumberInput.required = false;

        courseGroup.style.display = "none";
        courseSelect.required = false;
        courseSelect.value = "";

        if (roleSelect.value === "volunteer" || roleSelect.value === "tutor") {
          studentNumberGroup.style.display = "block";
          studentNumberInput.required = true;
        } else if (roleSelect.value === "organiser") {
          courseGroup.style.display = "block";
          courseSelect.required = true;
          loadCoursesOnce();
        }
      });

      /* ================================================
         FORM SUBMISSION
         ================================================ */

      // Five to seven digits, numbers only — the server enforces the
      // same rule.
      const STUDENT_NUMBER_RE = /^\d{5,7}$/;

      const form = document.getElementById("google-register-form");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!googleUserId || !googleEmail) {
          setMessage(
            "Your Google session has expired. Please sign in again.",
            "error",
          );
          return;
        }

        const role = roleSelect.value;
        const studentNumber = studentNumberInput.value.trim();
        const courseId = courseSelect.value;
        const googleAccessToken = sessionStorage.getItem("googleAccessToken");

        if (role === "organiser" && !courseId) {
          setMessage("Choose the course you want to organise.", "error");
          return;
        }

        if (
          (role === "volunteer" || role === "tutor") &&
          !STUDENT_NUMBER_RE.test(studentNumber)
        ) {
          setMessage("Student number must be 5–7 digits.", "error");
          return;
        }

        const requestBody = {
          googleUserId: googleUserId,
          email: googleEmail,
          name: googleName,
          role: role,
          studentNumber: studentNumber,
          courseId: role === "organiser" ? Number(courseId) : undefined,
          accessToken: googleAccessToken,
        };

        try {
          setMessage("Creating your account...");

          const response = await fetch("/api/auth/google/register", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(requestBody),
          });

          const result = await response.json();

          if (!response.ok) {
            setMessage(result.error || "Registration failed.", "error");
            console.error("Google registration error:", result);
            return;
          }

          /* New organisers can't sign in until the super-organiser
             approves their course request — say so instead of starting
             a session they can't use yet. */
          if (result.user.role === "organiser") {
            setMessage(
              "Registration received! Your organiser request is awaiting approval — you can sign in once it's approved.",
              "success",
            );

            sessionStorage.removeItem("googleUserId");
            sessionStorage.removeItem("googleEmail");
            sessionStorage.removeItem("googleName");
            sessionStorage.removeItem("googleAccessToken");

            setTimeout(() => {
              window.location.href = "/html/login.html";
            }, 2500);

            return;
          }

          setMessage("Registration successful! Redirecting...", "success");

          // Same sessionStorage keys public/js/auth.js sets for password
          // logins, so pages reading getCurrentUser() recognize this session.
          sessionStorage.setItem("access_token", googleAccessToken);
          sessionStorage.setItem("user", JSON.stringify(result.user));

          sessionStorage.removeItem("googleUserId");
          sessionStorage.removeItem("googleEmail");
          sessionStorage.removeItem("googleName");
          sessionStorage.removeItem("googleAccessToken");

          switch (result.user.role) {
            // Legacy accounts created before the Volunteer rename.
            case "student":
            case "volunteer":
              window.location.href = "/html/StudentView.html";
              break;

            case "tutor":
              window.location.href = "/html/dashboard.html";
              break;

            case "educator":
              window.location.href = "/html/educator.html";
              break;

            case "organiser":
            case "super_organiser":
              window.location.href = "/html/board.html";
              break;

            default:
              window.location.href = "/html/login.html";
          }
        } catch (error) {
          console.error("Google registration error:", error);
          setMessage(
            "Could not connect to the server. Please try again.",
            "error",
          );
        }
      });
    </script>
  </body>
</html>
