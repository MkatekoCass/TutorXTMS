<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/txlogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Completed sessions | TutorX</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/app.css" />
    <script src="../js/theme.js"></script>
    <script src="../js/nav-menu.js"></script>
    <script src="../js/auto-sync.js"></script>
  </head>

  <body data-theme="volunteer">
    <header class="app-navbar">
      <a class="brand-mark" href="StudentView.html">
        <span class="brand-mark-badge">
          <img src="../images/txlogo.png" alt="" />
        </span>
        <span class="brand-mark-name">TutorX</span>
      </a>

      <nav class="tab-nav" aria-label="Main navigation">
        <a href="StudentView.html">Dashboard</a>
        <a href="my-sessions.html">My sessions</a>
        <a href="volunteer-log-hours.html">Log Hours</a>
        <a href="student-calendar.html">Calendar</a>
        <a href="volunteer-timesheets.html" aria-current="page"
          >Completed sessions</a
        >
        <a href="student-profile.html">Profile</a>
      </nav>

      <div class="navbar-right">
        <a
          href="StudentView.html?tour=1"
          class="tour-trigger"
          aria-label="Take a tour"
          title="Take a tour"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="10" />
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
            <path d="M12 17h.01" />
          </svg>
        </a>
        <div class="notif-bell" id="notifBell">
          <button
            type="button"
            id="notifBellBtn"
            class="notif-bell-btn"
            aria-haspopup="true"
            aria-expanded="false"
            aria-label="Notifications"
          >
            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
              <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            </svg>
            <span class="notif-bell-badge" id="notifBellBadge" hidden>0</span>
          </button>
          <div class="notif-dropdown" id="notifDropdown" hidden>
            <div class="notif-dropdown-head">
              <span>Notifications</span>
              <button
                type="button"
                id="notifMarkAllBtn"
                class="notif-mark-all-btn"
              >
                Mark all read
              </button>
            </div>
            <ul class="notif-list" id="notifList"></ul>
            <p class="notif-empty" id="notifEmpty" hidden>
              No notifications yet.
            </p>
          </div>
        </div>

        <div class="user-pill">
          <span id="user-name">Account</span>
          <span class="role-badge" id="user-role-badge">Volunteer</span>
        </div>

        <a href="#" id="logout-button" class="btn-logout">Log out</a>
      </div>
    </header>

    <main class="app-main">
      <div class="page-head">
        <div>
          <h1>Completed sessions</h1>
          <p class="page-sub">
            The volunteer sessions you've completed, and the hours you logged
            for them.
          </p>
        </div>
      </div>

      <div class="panel panel--list" id="timesheetPanel">
        <div id="timesheetList">
          <!-- rendered by volunteer-timesheets.js -->
        </div>
      </div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="../js/user-badge.js"></script>
    <script type="module" src="../js/volunteer-timesheets.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/logout.js"></script>
  </body>
</html>
